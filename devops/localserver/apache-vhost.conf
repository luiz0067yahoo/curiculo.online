# ==============================================================================
# CONFIGURAÇÃO DE VIRTUALHOST DO APACHE LOCAL - CURRICULO.ONLINE
# ==============================================================================

<VirtualHost *:80>
    ServerName curriculo.local
    ServerAlias www.curriculo.local
    DocumentRoot "C:/Users/10345/Documents/GitHub/curiculo.online"

    <Directory "C:/Users/10345/Documents/GitHub/curiculo.online">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted

        # Redirecionamento unificado
        RewriteEngine On
        
        # Rotas da API RESTful para o backend
        RewriteRule ^api/(.*)$ backend/index.php [QSA,L]

        # Rota para arquivos estáticos existentes
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Rota padrão para o Frontend SPA compilado
        RewriteRule ^ index.php [L]
    </Directory>

    ErrorLog "logs/curriculo_online_error.log"
    CustomLog "logs/curriculo_online_access.log" combined
</VirtualHost>
