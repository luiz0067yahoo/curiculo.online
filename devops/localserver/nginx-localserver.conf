# ==============================================================================
# CONFIGURAÇÃO NGINX PARA AMBIENTE LOCAL - CURRICULO.ONLINE
# ==============================================================================

server {
    listen 80;
    server_name curriculo.local;

    # Raiz do projeto
    root /var/www/html/curiculo.online;
    index index.php index.html;

    charset utf-8;

    # Encaminhamento das chamadas da API para o backend PHP
    location /api/ {
        rewrite ^/api/(.*)$ /backend/index.php last;
    }

    # Arquivos estáticos compilados do React
    location /assets/ {
        alias /var/www/html/curiculo.online/frontend/dist/assets/;
        expires 30d;
        access_log off;
    }

    # Roteamento padrão SPA
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processamento PHP via FastCGI (PHP-FPM)
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Proteção de arquivos ocultos
    location ~ /\. {
        deny all;
    }
}
