apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: curriculo-online
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: curriculo-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: curriculo-config
            - secretRef:
                name: curriculo-secrets
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: curriculo-online
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
